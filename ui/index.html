<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LIS Bridge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    
    <!-- Header -->
    <header>
      <div class="brand">
        <div class="logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v7.31"/><path d="M14 9.3V1.99"/><path d="M8.5 2h7"/><path d="M14 9.3a6.5 6.5 0 1 1-4 0"/><path d="M5.52 16h12.96"/></svg>
        </div>
        <div>
          <h1 id="header-title">APEX LIS BRIDGE</h1>
          <p id="header-subtitle">Ready to initialize</p>
        </div>
      </div>
      
      <div class="status-grid">
        <div class="status-card">
          <span class="label">Cloud DB</span>
          <span id="db-status" class="value text-yellow">Connecting...</span>
        </div>
        <div class="status-card">
          <span class="label">TCP Status</span>
          <span id="tcp-status" class="value text-red">Offline</span>
        </div>
      </div>
    </header>

    <!-- Control Bar -->
    <div class="control-bar">
      <div class="input-group">
        <label>IP Address</label>
        <input type="text" id="ip-input" value="0.0.0.0">
      </div>
      <div class="input-group">
        <label>Port</label>
        <input type="number" id="port-input" value="5003">
      </div>
      <button id="connect-btn" class="btn-primary">Connect & Listen</button>
    </div>
    
    <!-- Logs -->
    <main>
      <div class="log-header">
        <span>Live Event Log</span>
        <button id="clear-logs" class="btn-secondary">Clear History</button>
      </div>
      <div id="log-container" class="log-stream">
        <!-- Logs will appear here -->
      </div>
    </main>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
